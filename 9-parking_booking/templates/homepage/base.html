<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parking Booking{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #212529; }
        .container { max-width: 1140px; margin: 0 auto; padding: 0 15px; }
        nav { background: #343a40; padding: 12px 0; margin-bottom: 24px; }
        nav .container { display: flex; align-items: center; gap: 16px; }
        nav a { color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 4px; }
        nav a:hover { background: #495057; }
        .navbar-brand { font-size: 20px; font-weight: 700; }
        .navbar-nav { display: flex; gap: 6px; }
        h1 { margin-bottom: 16px; }
        h2 { margin: 20px 0 12px; }
        .card { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .border-primary { border-color: #0d6efd; border-width: 2px; }
        .border-success { border-color: #198754; border-width: 2px; }
        .border-info { border-color: #0dcaf0; border-width: 2px; }
        .row { display: flex; flex-wrap: wrap; gap: 16px; }
        .col-md-4 { flex: 1 1 30%; min-width: 260px; }
        .col-md-3 { flex: 1 1 22%; min-width: 200px; }
        .col-md-2 { flex: 1 1 14%; min-width: 150px; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin: 12px 0; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background: #343a40; color: #fff; }
        tbody tr:hover { background: #f8f9fa; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 4px; text-decoration: none; border: 1px solid transparent; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-success { background: #198754; color: #fff; }
        .btn-info { background: #0dcaf0; color: #000; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-outline-secondary { background: #fff; color: #6c757d; border-color: #6c757d; }
        .btn-outline-secondary.active, .btn-outline-secondary:hover { background: #6c757d; color: #fff; }
        .btn-outline-primary { background: #fff; color: #0d6efd; border-color: #0d6efd; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; color: #fff; }
        .bg-success { background: #198754; }
        .bg-danger { background: #dc3545; }
        .bg-secondary { background: #6c757d; }
        .text-primary { color: #0d6efd; }
        .text-success { color: #198754; }
        .text-info { color: #0dcaf0; }
        .text-white { color: #fff; }
        .text-muted { color: #6c757d; }
        .text-danger { color: #dc3545; }
        .jumbotron { background: #fff; padding: 32px; border-radius: 8px; margin-bottom: 20px; }
        .display-4 { font-size: 32px; font-weight: 300; }
        .display-6 { font-size: 28px; font-weight: 500; }
        .alert-danger { background: #f8d7da; color: #842029; padding: 12px; border-radius: 4px; margin: 12px 0; }
        form { margin: 12px 0; }
        .form-label { display: block; margin-bottom: 4px; font-weight: 500; }
        .form-control, .form-select { padding: 7px; border: 1px solid #ced4da; border-radius: 4px; width: 100%; }
        .align-items-end { align-items: flex-end; }
        .g-3 { gap: 12px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 20px; }
        .mt-4 { margin-top: 20px; }
        .ms-2 { margin-left: 8px; }
        .pagination { list-style: none; display: flex; gap: 4px; justify-content: center; margin: 20px 0; }
        .page-link { padding: 6px 12px; border: 1px solid #dee2e6; background: #fff; color: #0d6efd; text-decoration: none; border-radius: 4px; }
        .page-item.active .page-link { background: #0d6efd; color: #fff; }
        .page-item.disabled .page-link { color: #999; background: #eee; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a class="navbar-brand" href="{% url 'homepage:index' %}">Parking Booking</a>
            <div class="navbar-nav">
                <a href="{% url 'spots:list' %}">Места</a>
                <a href="{% url 'bookings:list' %}">Бронирования</a>
                <a href="{% url 'bookings:statistics' %}">Статистика</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
